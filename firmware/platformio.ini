; 构建目录指到纯英文路径。
;
; 背景：如果工程所在路径含中文/空格，本机 xtensa 链接器在 .pio/build/esp32dev
; 下创建 firmware.map 时会报 "cannot open map file ... Permission denied /
; Invalid argument"。把 build_dir 指到一个纯英文目录即可绕开，源码与产物
; 内容都不受影响，只是中间文件位置变了。
;
; 这里用 USERPROFILE 变量展开，避免把个人路径写死：各人 clone 下来会自动
; 落到自己的用户目录下。如果你的工程路径本来就是纯英文，删掉这行即可。
[platformio]
build_dir = ${sysenv.USERPROFILE}/pio_build/printer

; MiniPrinter 新版固件
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 源码按 hal/ app/ core/ 三层组织，头文件分散在各层目录里。
; PlatformIO 只默认把 src/ 加进 include 路径，这里把三层都显式加上，
; 这样任何模块都能直接 #include "printer.h" 而不必写相对路径。
; src/ 下的 .cpp 会被引擎递归编译，不需要额外 src_filter。
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Isrc
    -Isrc/hal
    -Isrc/app
    -Isrc/app/selftest
    -Isrc/core
