; 构建目录指到纯英文路径。
; 原因：工程所在路径含中文（热敏蓝牙打印机），本机 xtensa 链接器在
; .pio/build/esp32dev 下创建 firmware.map 时会报
; "cannot open map file ... Permission denied / Invalid argument"，
; 换到英文路径后正常。源码与产物内容都不受影响，只是中间文件位置变了。
; 若换机器编译，把下面这行删掉即可恢复默认的 .pio/build。
[platformio]
build_dir = C:/Users/23190/WorkBuddy/pio_build/printer

; MiniPrinter 新版固件
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 源码按 hal/ app/ core/ 三层组织，头文件分散在各层目录里。
; PlatformIO 只默认把 src/ 加进 include 路径，这里把三层都显式加上，
; 这样任何模块都能直接 #include "printer.h" 而不必写相对路径。
; src/ 下的 .cpp 会被引擎递归编译，不需要额外 src_filter。
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Isrc
    -Isrc/hal
    -Isrc/app
    -Isrc/app/selftest
    -Isrc/core
