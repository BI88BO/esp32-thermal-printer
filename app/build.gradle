plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.miniprinter'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.miniprinter"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    /* Material 3：卡片、按钮、滑块、输入框的整套视觉规范。
     * 1.7.0 已在本机 Gradle 缓存里，离线可构建。
     * 它自带依赖 constraintlayout 2.0.1，而缓存里只有 2.1.3，
     * 离线会解析失败，所以这里显式抬到 2.1.3（Gradle 取高版本，兼容） */
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
}
